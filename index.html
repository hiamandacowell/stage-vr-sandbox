<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stage VR LAB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --ink:#0B0C0E;
    --surface:#15171A;
    --surface-2:#1D2025;
    --line:#2A2E34;
    --text:#F1F3F5;
    --muted:#99A0A9;
    --brass:#C9913F;
    --brass-dim:#8A6329;
    --warn:#E0A6A6;
    --display:"Fraunces", Georgia, "Times New Roman", serif;
    --ui:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0;padding:0;min-height:100vh;min-height:100dvh;
    background:var(--ink);
    color:var(--text);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0;}

  #ui{
    position:relative; z-index:2; min-height:100vh; min-height:100dvh;
    padding:34px 20px 56px;
    background:
      radial-gradient(120% 70% at 50% -8%, rgba(201,145,63,0.11) 0%, rgba(11,12,14,0) 60%),
      var(--ink);
  }
  .wrap{max-width:460px;margin:0 auto;}

  h1{
    font-family:var(--display);
    font-weight:600; font-size:34px; line-height:1.08; letter-spacing:-0.015em;
    margin:0 0 14px; text-wrap:balance;
  }
  .rule{height:1px;background:linear-gradient(90deg,var(--brass),rgba(201,145,63,0));margin:0 0 18px;}
  .sub{font-size:14.5px;line-height:1.6;color:var(--muted);margin:0 0 26px;}
  .sub b{color:var(--text);font-weight:500;}

  /* the select still drives loadSky and what gets saved; the tiles set it */
  #env{display:none;}

  .pick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 28px;}
  .tile{
    position:relative;padding:0;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .tile .shot{
    display:block;height:104px;background-size:cover;background-position:center;
    filter:saturate(.85) brightness(.8);
  }
  .tile[data-env="img-stage"] .shot{background-image:url(hill-stage.jpg);background-position:48% 58%;}
  .tile[data-env="img-green"] .shot{background-image:url(hill-greenroom.jpg);background-position:75% 55%;}
  .tile .cap{
    display:block;padding:11px 12px 12px;font-size:14.5px;font-weight:500;color:var(--text);
  }
  .tile[aria-pressed="true"]{border-color:var(--brass);}
  .tile[aria-pressed="true"] .shot{filter:none;}
  .tile[aria-pressed="true"]::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brass);
  }

  details{margin:2px 0 6px;}
  details summary{
    font-size:12.5px;color:var(--brass);cursor:pointer;padding:6px 2px;list-style:none;
  }
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:"+ ";font-weight:600;}
  details[open] summary::before{content:"- ";}
  details p{font-size:12.8px;line-height:1.6;color:var(--muted);margin:2px 2px 10px;}
  details p b{color:var(--text);font-weight:600;}

  button{font-family:var(--ui);}
  button.go{
    width:100%;padding:16px;font-size:16px;font-weight:600;letter-spacing:.01em;
    border:0;border-radius:10px;background:var(--text);color:#0B0C0E;cursor:pointer;
  }
  button.go:hover{background:#fff;}
  button.ghost{
    width:100%;padding:15px;font-size:16px;border:1px solid var(--line);border-radius:10px;
    background:transparent;color:var(--muted);cursor:pointer;margin-top:10px;
  }
  /* a way in says what it is on the first line and what you need on the second,
     because the name of a thing and the thing you are holding are two questions
     and both of them get asked */
  button.go b, button.ghost b{display:block;font-weight:600;}
  button.go span, button.ghost span{
    display:block;margin-top:4px;font-size:13px;font-weight:400;letter-spacing:0;
  }
  button.go span{color:#4A4E55;}
  button.ghost span{color:#6B7280;}
  button.ghost:hover{color:var(--text);border-color:var(--muted);}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

  .note{font-size:12.8px;color:var(--muted);line-height:1.6;margin:16px 0 0;}
  ul.note{margin:20px 0 0;padding:0;list-style:none;}
  ul.note li{position:relative;padding:0 0 0 16px;margin:0 0 7px;}
  ul.note li::before{
    content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
    border-radius:50%;background:var(--brass);
  }
  .note b{color:var(--text);font-weight:600;}
  /* This used to live inside the start screen, which is hidden the moment you
     go in, so everything it had to say about why something was not working was
     written where nobody could read it. It sits over the scene now, and takes
     no room at all until it has something to say. */
  #err{
    color:var(--warn);font-size:12.8px;line-height:1.6;
    position:fixed;left:0;right:0;top:0;z-index:5;
    margin:0;padding:10px 16px;text-align:center;
    background:rgba(14,13,12,0.82);
    pointer-events:none;
  }
  #err:empty{display:none;}

  #gate{
    position:relative; z-index:3; min-height:100vh; min-height:100dvh;
    padding:34px 20px 56px; display:flex; align-items:center; justify-content:center;
  }
  #gate .wrap{width:100%;}
  #gate input{
    width:100%; padding:15px; margin:0 0 10px; font-family:var(--ui); font-size:18px;
    letter-spacing:.14em; text-align:center; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  }
  #hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:none;gap:8px;}
  #hud button{
    padding:9px 15px;font-size:12.5px;border-radius:999px;border:1px solid rgba(239,233,223,.22);
    background:rgba(14,13,12,.62);color:var(--text);backdrop-filter:blur(8px);cursor:pointer;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>


<div id="gate"><div class="wrap">
  <h1>Stage VR LAB</h1>
  <div class="rule"></div>
  <p class="sub">Not a public page. Enter the password to go in.</p>
  <form id="gateForm" autocomplete="off">
    <input id="pin" type="password" autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="password" aria-label="Password">
    <button class="go" type="submit">Unlock</button>
  </form>
  <p class="note" id="gateErr" role="status"></p>
</div></div>

<div id="ui" style="display:none"><div class="wrap">
  <h1>Stage VR LAB</h1>
  <div class="rule"></div>

  <p class="pick">Where do you want to start?</p>
  <!-- green room on the left, stage on the right, which is the order you do
       them in: you wait to go on, then you go on. Which one is selected still
       comes from the script, so the order here is only the order you read. -->
  <div class="tiles">
    <button class="tile" type="button" data-env="img-green" aria-pressed="false">
      <span class="shot"></span><span class="cap">Green room</span>
    </button>
    <button class="tile" type="button" data-env="img-stage" aria-pressed="true">
      <span class="shot"></span><span class="cap">On stage</span>
    </button>
  </div>

  <select id="env" aria-label="Environment">
    <option value="img-stage">On stage</option>
    <option value="img-green">Green room</option>
  </select>

  <!-- Named for what you physically do, because that is the only thing that
       does not change by device. immersive-vr is not one experience: a phone
       hands it to Cardboard and a headset makes it a headset session. Both of
       those are putting it on your face, so both are one button, and the device
       answers the rest without anyone having to detect anything. -->
  <button class="go" id="enter">
    <b>Wear it</b><span>A VR headset or a Cardboard viewer with phone</span>
  </button>
  <button class="ghost" id="use360">
    <b>Hold up your phone/tablet</b><span>Move device around to look</span>
  </button>
  <button class="ghost" id="peek">
    <b>Browser</b><span>A laptop, drag with the mouse to look around</span>
  </button>
  <button class="ghost" id="forget">Forget my setup and start fresh</button>

  <p class="note" id="modeNote"></p>
</div></div>
<p id="err" role="status"></p>

<div style="display:none" aria-hidden="true">
  <img id="img-stage" alt="" src="hill-stage.jpg">
  <img id="img-green" alt="" src="hill-greenroom.jpg">
</div>

<div id="hud">
  <button id="exit">Exit</button>
  <button id="recenter">Recenter</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function bootPracticeSpace() {
  'use strict';
  if (typeof THREE === 'undefined') {
    var e0 = document.getElementById('err');
    if (e0) e0.textContent = 'The 3D library did not load, so only this screen works. Open the page directly rather than inside a preview frame.';
    return;
  }

  var ui = document.getElementById('ui');
  var hud = document.getElementById('hud');
  var errEl = document.getElementById('err');

  var renderer, scene, camera, sky, skyTex, videoEl, videoTex;
  var reticle, reticleRing, hintPlate = null, menuTip = null;
  // the pointer to the tab retires for good once you have opened the menu once
  var menuFound = false;
  var pickables = [];
  var mode = 'flat';
  var inScene = false;
  var orient = null;
  var dragging = false, dragX = 0, dragY = 0, yaw = 0, pitch = 0, yawOffset = 0;

  // Whether looking around is done by dragging rather than by moving the thing
  // you are holding. That is the browser always, and it is any of the others
  // that turned out to have no head tracking to run on.
  //
  // Choosing the viewer and being handed one flat picture is the wrong answer:
  // the two eyes are the thing you asked for, and they are drawn whether or not
  // anything is reporting which way you are pointed. It also fixes itself the
  // moment a reading does arrive, so a device that is merely slow to start
  // reporting is not left on the drag for the rest of the session.
  function dragLook() {
    return mode === 'flat' || ((mode === 'stereo' || mode === 'window') && !orient);
  }

  var EYE = 1.15;

  // two independent windows on the real room, both fed by the one rear camera.
  // the music window hangs in front of your face; the piano lies flat where the
  // real keybed is, so its body can be built around it in the right orientation.
  // Both rigs start a little to the left of where you are facing, so the default
  // view is you angled out towards the house rather than square to your own
  // keys, which is how you actually sit at the instrument on a stage. One number
  // moves the piano and the music window together; they belong to each other.
  var RIG_YAW = THREE.MathUtils.degToRad(-10);

  var piano = {
    kind: 'deck', on: true,
    yaw: RIG_YAW, drop: 0.46, dist: 0.44, width: 1.0,
    group: null, win: null, fallback: null
  };

  // Music windows are a list rather than one fixed panel, and width and height
  // move independently, which covers square, letterbox and portrait without
  // needing preset shapes.
  //
  // One window is what ships. The list, the add and remove entries and the
  // menu's handling of several all still work: raise this and they come back on
  // their own.
  var PANEL_MAX = 1;
  var panels = [];

  var raycaster = new THREE.Raycaster();
  var gazeHit = null, gazeHeld = 0, movingRig = null, sizingRig = null, grabbedEdge = null,
      recentering = false, parking = false, lastT = 0;
  var steady = 0, lastDir = new THREE.Vector3(), swingAvg = 0, moveAge = 0;
  var pendingRecenter = false;
  // where you were looking when a hold was armed, and how far off that you must
  // get before a recenter will commit. without it, picking recenter and then
  // simply not moving would set front to the menu you were staring at.
  var armDir = new THREE.Vector3();
  // How far you must have looked away from the tile you picked before holding
  // still can commit. It is only there so that the gaze which picked the tile
  // cannot immediately commit on the same spot; being off the tile is the whole
  // requirement, and a tile crosses about 7 degrees.
  //
  // It was 15, which is more than the distance from the recenter tile to
  // straight ahead. Recentring to roughly where you are already facing is the
  // ordinary case, and it could never complete: the ring sat at nothing and
  // held there. With the menu parked low it was impossible at any bearing.
  var MIN_TURN = 6;
  // Letting go of an edge is not the same act as putting a whole rig down. You
  // took the edge in order to move it, so releasing before you have moved it is
  // never what you meant — and the release could fire on the stillness you were
  // already in from staring at the handle to take it, which gave you one short
  // window to move the edge and then let go wherever it had got to. It now
  // wants you to have moved it at all, and then a longer settle than a drop, so
  // that stopping to judge the size is not the same as agreeing to it.
  var EDGE_TURN = 6, EDGE_DWELL = 1.4;
  // seconds of gaze to ignore after something fires. without it the stare that
  // chose a menu item carries straight on into whatever replaces it.
  var cooldown = 0, COOLDOWN = 0.7, mustLeave = null;
  // nothing in the scene except the menu answers to your gaze. you can stare at
  // your own keys through the piano window for as long as you like.
  var DWELL = 0.85, REPEAT_DELAY = 0.28, PLACE_DWELL = 0.9;
  // How still "still" has to be, in degrees per second. A phone's orientation
  // stream jitters by a fraction of a degree between frames even on a head that
  // is not moving, and at 60fps a tenth of a degree already reads as 6 deg/sec,
  // so a tight limit measures noise rather than you. Turning to look at
  // something runs into the hundreds, so this still tells the two apart.
  var STEADY_LIMIT = 25;
  var SWING_SMOOTH = 0.12;   // seconds of smoothing on the speed estimate
  var STEADY_DECAY = 2;      // a wobble costs progress at this rate, never all of it
  var MIN_MOVE = 0.6;        // seconds before a placement can complete at all
  // width units per second while you hold a gaze on smaller or bigger. the whole
  // range is 0.4 to 2.4, so this crosses it in eight seconds; at 0.8 it crossed
  // in under three and you could not stop where you meant to.
  var SIZE_RATE = 0.25;
  // metres per second of height while you hold a gaze on lower or higher. A
  // gaze is a direction and carries no distance, so how far below your eyes the
  // keys sit is the one thing looking at them cannot say: it needs its own
  // control, and two buttons are honestly the right tool for it.
  var DROP_RATE = 0.22;
  var tmpQ = new THREE.Quaternion(), vDir = new THREE.Vector3(), vPos = new THREE.Vector3();

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    // local puts the origin where your head was when the session opened.
    // local-floor puts it on the floor, which means the app has to know how
    // tall you are to place anything at eye level, and it does not. See head().
    renderer.xr.setReferenceSpaceType('local');
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 1000);
    camera.position.set(0, EYE, 0);
    scene.add(camera);

    var geo = new THREE.SphereGeometry(60, 64, 40);
    geo.scale(-1, 1, 1);
    sky = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x14110f }));
    scene.add(sky);

    // the panorama is unlit basic material; these lights exist only so the
    // piano body has some shape to it instead of reading as a black silhouette
    scene.add(new THREE.AmbientLight(0xffffff, 0.30));
    var key = new THREE.DirectionalLight(0xFFE6C2, 1.15);
    key.position.set(-1.4, 2.0, 0.5);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0x9FB6D4, 0.45);
    fill.position.set(1.2, 0.7, -0.8);
    scene.add(fill);
    // a hard light almost overhead is what puts the long streak down a polished lid
    var sheen = new THREE.DirectionalLight(0xFFF4E2, 0.7);
    sheen.position.set(0.4, 3.0, -2.0);
    scene.add(sheen);

    buildPianoRig();
    buildMenu();
    buildReticle();
    placeAll();

    window.addEventListener('resize', onResize);
    renderer.setAnimationLoop(render);
  }

  // ---------- geometry helpers ----------

  // Both windows are holes in the panorama showing whatever the rear camera can
  // actually see behind them. Rather than crop the frame, each fragment is
  // projected back through a virtual camera sitting at your head and pointed
  // where you are pointed, which is where the phone's lens really is. Wherever
  // that projection lands outside the frame, the window is black, because the
  // camera genuinely cannot see there.
  //
  // Both meshes share one material, so the projection is computed once a frame.
  var PHONE_FOV_H = 65;   // degrees across, about what a phone rear camera gives back
  var winMat = null;
  var phoneCam = new THREE.PerspectiveCamera();

  function windowMaterial() {
    if (winMat) return winMat;
    winMat = new THREE.ShaderMaterial({
      uniforms: {
        uVideo:    { value: null },
        uHasVideo: { value: 0 },
        uCamProj:  { value: new THREE.Matrix4() }
      },
      vertexShader: [
        'uniform mat4 uCamProj;',
        'varying vec4 vProj;',
        'void main() {',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vProj = uCamProj * wp;',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D uVideo;',
        'uniform float uHasVideo;',
        'varying vec4 vProj;',
        'void main() {',
        '  if (uHasVideo < 0.5 || vProj.w <= 0.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }',
        // the divide happens per fragment, so the mapping stays correct on a
        // plane lying flat under you as well as one square to your face
        '  vec2 uv = (vProj.xy / vProj.w) * 0.5 + 0.5;',
        '  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {',
        '    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;',
        '  }',
        '  gl_FragColor = vec4(texture2D(uVideo, uv).rgb, 1.0);',
        '}'
      ].join('\n')
    });
    return winMat;
  }

  // the lens rides on your head, so the virtual camera takes the head pose. in
  // stereo both eyes get the same projection, which is honest: there is one lens.
  function updateWindowProjection() {
    if (!winMat) return;
    var vc = viewCamera();
    vc.updateMatrixWorld();
    phoneCam.position.setFromMatrixPosition(vc.matrixWorld);
    vc.getWorldQuaternion(phoneCam.quaternion);

    var aspect = (videoEl && videoEl.videoWidth && videoEl.videoHeight)
      ? videoEl.videoWidth / videoEl.videoHeight : 4 / 3;
    // phone cameras are quoted across; three wants the vertical angle
    phoneCam.fov = 2 * THREE.MathUtils.radToDeg(
      Math.atan(Math.tan(THREE.MathUtils.degToRad(PHONE_FOV_H) / 2) / aspect)
    );
    phoneCam.aspect = aspect;
    phoneCam.near = 0.05;
    phoneCam.far = 100;
    phoneCam.updateProjectionMatrix();
    phoneCam.updateMatrixWorld(true);

    winMat.uniforms.uCamProj.value.multiplyMatrices(
      phoneCam.projectionMatrix, phoneCam.matrixWorldInverse
    );
  }

  // a drawn keybed, sitting in the piano window until the camera hands over a
  // picture, and left there if it never does. it is a placeholder, not your keys.
  function keybedTexture() {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 300;
    var g = c.getContext('2d');
    g.fillStyle = '#08080A'; g.fillRect(0, 0, 1024, 300);

    var n = 36, w = 1024 / n, i;
    for (i = 0; i < n; i++) {
      var grd = g.createLinearGradient(0, 44, 0, 300);
      grd.addColorStop(0, '#7C786F');
      grd.addColorStop(0.35, '#B4AEA3');
      grd.addColorStop(1, '#DAD5CA');
      g.fillStyle = grd;
      g.fillRect(i * w + 1.6, 44, w - 3.2, 254);
    }

    var pattern = [0, 1, 3, 4, 5];
    for (var oct = 0; oct < 6; oct++) {
      for (var p = 0; p < pattern.length; p++) {
        var idx = oct * 7 + pattern[p];
        if (idx >= n - 1) continue;
        var bg = g.createLinearGradient(0, 44, 0, 212);
        bg.addColorStop(0, '#04050A');
        bg.addColorStop(1, '#20242F');
        g.fillStyle = bg;
        g.fillRect((idx + 1) * w - w * 0.29, 44, w * 0.58, 168);
      }
    }

    // the shadow the fallboard throws over the back of the keys
    var sh = g.createLinearGradient(0, 44, 0, 118);
    sh.addColorStop(0, 'rgba(0,0,0,0.78)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh; g.fillRect(0, 44, 1024, 74);

    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function labelTexture(text, accent) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    var g = c.getContext('2d');
    // brass is the dwell ring's colour and means "you are selecting this", so the
    // tag is deliberately not brass: pale, like a physical tag, and readable
    // against a dark ceiling without pretending to be a progress indicator
    g.fillStyle = accent ? 'rgba(239,233,223,0.95)' : 'rgba(14,13,12,0.82)';
    roundRect(g, 5, 5, 246, 118, 24); g.fill();
    g.strokeStyle = accent ? 'rgba(48,41,37,0.85)' : 'rgba(201,145,63,0.55)';
    g.lineWidth = accent ? 5 : 3;
    roundRect(g, 5, 5, 246, 118, 24); g.stroke();
    g.fillStyle = accent ? '#191614' : '#EFE9DF';
    // shrink to fit rather than run off the plate: "hold still to place" and
    // "music window" are both wider than the label at the nominal size
    var size = 40;
    g.font = '600 ' + size + 'px system-ui, sans-serif';
    while (size > 17 && g.measureText(text).width > 212) {
      size -= 2;
      g.font = '600 ' + size + 'px system-ui, sans-serif';
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 128, 66);
    return new THREE.CanvasTexture(c);
  }

  // ---------- the two rigs ----------

  // a unit plane, scaled per panel. round windows were tried and pulled; the
  // shader ignores uvs, so bringing another shape back is only a geometry swap.
  function panelGeometry() {
    return new THREE.PlaneGeometry(1, 1);
  }

  function makePanel(init) {
    var p = {
      kind: 'panel', on: true,
      azim: RIG_YAW, elev: THREE.MathUtils.degToRad(-14), dist: 1.05,
      w: 1.05, h: 0.59,
      group: null, win: null
    };
    if (init) {
      for (var k in init) if (Object.prototype.hasOwnProperty.call(p, k)) p[k] = init[k];
    }
    p.group = new THREE.Group();
    p.win = new THREE.Mesh(panelGeometry(), windowMaterial());
    p.group.add(p.win);
    p.group.visible = p.on;
    scene.add(p.group);
    return p;
  }

  function removePanel(i) {
    var p = panels[i];
    if (!p) return;
    scene.remove(p.group);
    p.win.geometry.dispose();
    panels.splice(i, 1);
    if (movingRig === p) { movingRig = null; hintPlate.visible = false; }
    if (sizingRig === p) { sizingRig = null; grabbedEdge = null; hintPlate.visible = false; }
  }

  // a new window lands beside the ones already out rather than on top of them
  function addPanel() {
    if (panels.length >= PANEL_MAX) return null;
    var p = makePanel({ azim: RIG_YAW + THREE.MathUtils.degToRad(30 * panels.length) });
    panels.push(p);
    startPassthrough();
    placeAll();
    return p;
  }

  function buildPianoRig() {
    var r = piano;
    var g = new THREE.Group();
    // polished ebony is nearly black but it is never flat black; the highlight is
    // the whole reason it reads as a solid object and not a hole in the panorama
    var ebony = new THREE.MeshStandardMaterial({ color: 0x0D0C0B, roughness: 0.22, metalness: 0.10 });
    var ebonyMatte = new THREE.MeshStandardMaterial({ color: 0x0A0908, roughness: 0.62, metalness: 0.04 });
    var brass = new THREE.MeshStandardMaterial({ color: 0x5A4420, roughness: 0.68, metalness: 0.45 });
    var felt = new THREE.MeshStandardMaterial({ color: 0x5A1F24, roughness: 0.95 });

    // the window on your real keys, lying flat where the keybed is, so you look
    // down into it rather than at it
    r.win = new THREE.Mesh(new THREE.PlaneGeometry(1.06, 0.30), windowMaterial());
    r.win.rotation.x = -Math.PI / 2;
    r.win.position.y = 0.001;
    r.win.visible = false;
    g.add(r.win);

    // same footprint, untouched UVs, showing the drawn keybed until video arrives
    r.fallback = new THREE.Mesh(
      new THREE.PlaneGeometry(1.06, 0.30),
      new THREE.MeshBasicMaterial({ map: keybedTexture() })
    );
    r.fallback.rotation.x = -Math.PI / 2;
    g.add(r.fallback);

    // key slip along the front edge, the bit nearest your stomach. matte, because
    // a polished upward face this close to the eye blows out into a headlamp
    var slip = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.030, 0.055), ebonyMatte);
    slip.position.set(0, 0.008, 0.178);
    g.add(slip);

    // a thin edge on the slip, so the near lip of the piano has a line
    var edge = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.004, 0.008), brass);
    edge.position.set(0, 0.024, 0.205);
    g.add(edge);

    // cheek blocks either side of the keys
    [-1, 1].forEach(function (s) {
      var cheek = new THREE.Mesh(new THREE.BoxGeometry(0.070, 0.072, 0.360), ebony);
      cheek.position.set(s * 0.565, 0.030, 0.005);
      g.add(cheek);
    });

    // fallboard tipped back off the keys, then the music desk above it
    var fall = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.185, 0.026), ebony);
    fall.position.set(0, 0.082, -0.172);
    fall.rotation.x = -0.22;
    g.add(fall);

    var lip = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.022, 0.032), ebony);
    lip.position.set(0, 0.112, -0.228);
    g.add(lip);

    var desk = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.300, 0.018), ebonyMatte);
    desk.position.set(0, 0.248, -0.270);
    desk.rotation.x = -0.30;
    g.add(desk);

    // the rim running away from you, with the strip of felt you catch under the lid
    var rim = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.090, 1.05), ebony);
    rim.position.set(0, 0.150, -0.860);
    g.add(rim);

    var strip = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.006, 0.160), felt);
    strip.position.set(0, 0.198, -0.402);
    g.add(strip);

    g.visible = false;
    r.group = g;
    scene.add(g);
  }

  // when the camera arrives after the rigs are already built, hand it to both windows
  function attachVideo() {
    winMat.uniforms.uVideo.value = videoTex;
    winMat.uniforms.uHasVideo.value = 1;
    if (piano.win) piano.win.visible = true;
    if (piano.fallback) piano.fallback.visible = false;
    for (var i = 0; i < panels.length; i++) panels[i].win.visible = true;
  }

  // ---------- placement ----------

  // Where your eyes actually are. Everything in here is placed by angle on a
  // sphere around this point: the menu, the doors, the piano, the windows.
  //
  // On a screen or a phone held up, the camera is put at eye height above the
  // origin and a constant was right. In a real headset session it was not. The
  // headset owns the pose, local-floor puts the origin on the floor with your
  // eyes about 1.6 metres above it, and everything stayed hung around a point
  // 45 centimetres below them. On a reach of 0.85 metres that is not a small
  // error: ask for the menu 32 degrees above your eyeline and it arrived on
  // your eyeline, and the whole 15-to-45 band you can park it in squashed into
  // -16 to +14. It is also why the room read as the wrong size and the stage
  // felt like it was somewhere under your feet.
  //
  // The session asks for local rather than local-floor now, which puts the
  // origin at your head instead of on the floor. So in a session the head is
  // the origin, and every angle is measured from where you actually are.
  function head() {
    return new THREE.Vector3(0, mode === 'xr' ? 0 : EYE, 0);
  }

  function placePanel(r) {
    var d = new THREE.Vector3(
      Math.cos(r.elev) * Math.sin(r.azim),
      Math.sin(r.elev),
      -Math.cos(r.elev) * Math.cos(r.azim)
    );
    var h = head();
    r.group.position.copy(h.clone().addScaledVector(d, r.dist));
    r.group.scale.set(r.w, r.h, 1);
    r.group.lookAt(h);
  }

  function placePiano() {
    var r = piano;
    var p = new THREE.Vector3(
      Math.sin(r.yaw) * r.dist,
      head().y - r.drop,
      -Math.cos(r.yaw) * r.dist
    );
    r.group.position.copy(p);
    // Turn the piano to keep the keys towards you wherever you drag it, so it
    // swings around you rather than spinning on the spot. The group's local +Z
    // is the player's side, and the way back to your head from a point at
    // azimuth yaw is (-sin yaw, cos yaw), which Ry reaches at -yaw. Using +yaw
    // turned it away at twice the drag angle instead.
    r.group.rotation.y = -r.yaw;
    r.group.scale.setScalar(r.width);
  }

  function placeAll() {
    placePiano();
    for (var i = 0; i < panels.length; i++) {
      panels[i].group.visible = panels[i].on;
      placePanel(panels[i]);
    }
  }

  function placeRig(r) {
    if (r.kind === 'deck') placePiano(); else placePanel(r);
  }

  function refreshPickables() {
    pickables = [];
    if (menu.tab.visible) pickables.push(menu.tab);
    for (var i = 0; i < menu.ring.length; i++) {
      if (menu.ring[i].visible) pickables.push(menu.ring[i]);
    }
    for (var j = 0; j < menu.bloom.length; j++) {
      if (menu.bloom[j].visible) pickables.push(menu.bloom[j]);
    }
    for (var q = 0; q < menu.handles.length; q++) {
      if (menu.handles[q].visible) pickables.push(menu.handles[q]);
    }
    // last, and further off than any of the menu: where they overlap, the
    // nearer hit wins and the menu is always the nearer one
    if (doorMark && doorMark.visible) pickables.push(doorMark);
  }

  // ---------- the way out ----------

  // You leave a room by its door. Both panoramas have one, so the way between
  // them is the thing in the room rather than an entry in a list.
  //
  // Measured off the same forward as ENV_FORWARD: azim runs round from dead
  // ahead, positive to your right, elev up from eye level. On the stage that is
  // the open doorway at stage right, where the grey wall meets the panelling,
  // 95 degrees round. It is a long way off across the stage, so the opening is
  // only about 4 degrees across against the marker's 7: it covers the doorway
  // and a little of the jamb either side, which reads as a plate on the door
  // rather than a thing hanging near it. The pair of closed doors further round
  // at 122 was the first reading of "the door behind you" and the wrong one.
  //
  // In the green room it is the propped-open door to the corridor, and the
  // marker sits in the opening itself against the brick across the hall, not on
  // the leaf, because the leaf is standing open.
  //
  // The stage one cannot be reached without deliberately turning, which is what
  // makes it safe to leave a live button hanging in a room with nothing
  // guarding it: 95 degrees is square to your side. The green room's is
  // straight in front of you instead, so it earns its safety the other way: 12
  // degrees down, with the menu tag 25 up, and the reticle arriving on the
  // brick in the gap between them. That opening runs from 23 above to 28 below,
  // so both are inside the doorway and neither is anywhere your eyes rest.
  //
  // viaMenu means the way out of that room is a tile in the menu rather than a
  // marker on the door itself. The stage one is 95 degrees round, which is what
  // made it safe to leave hanging in a room with nothing guarding it, and is
  // also a long way to turn every time you want to leave. In the menu it is
  // three tiles from where you are already looking. Its azimuth is kept because
  // it is still where the door is; nothing draws it any more.
  //
  // The green room keeps its marker. It is straight ahead in the propped-open
  // doorway, under the menu tag on the head of the same frame, and everything
  // that room can do reads in one glance. There is nothing to fix there.
  var DOORS = {
    'img-stage': { azim: 95, elev: -3, label: 'green room', viaMenu: true },
    'img-green': { azim: 0, elev: -12, label: 'stage' }
  };
  // far enough out to read as hung on the wall rather than held in front of
  // your face, and sized from that to cross the same 7 degrees as a menu tile
  var DOOR_REACH = 2.45;
  var DOOR_TILE = 0.30;
  // a whole room on the 0.85s that hides a window is something that would
  // happen to you. This one wants to be meant.
  var DOOR_DWELL = 1.6;
  var doorMark = null;

  function layoutDoor() {
    if (!doorMark) return;
    var d = DOORS[currentEnv];
    // while you are placing or sizing something, the room is not the subject
    doorMark.visible = !!(d && !d.viaMenu && inScene && !movingRig && !sizingRig && !recentering && !parking);
    if (!doorMark.visible) return;
    doorMark.userData.id = 'door';
    doorMark.userData.repeat = false;
    doorMark.material.map = cachedIcon('room', d.label);
    doorMark.material.needsUpdate = true;
    doorMark.scale.setScalar(1);
    aimAt(doorMark,
      THREE.MathUtils.degToRad(d.azim),
      THREE.MathUtils.degToRad(d.elev),
      DOOR_REACH);
  }

  function switchRoom() {
    var el = document.getElementById('env');
    el.value = (el.value === 'img-stage') ? 'img-green' : 'img-stage';
    goToRoom(el.value);
    // You went through a door, so you are facing into the room you came out
    // in. Carrying your compass heading across a teleport is the stranger of
    // the two, and it left you looking at a side wall with both of that room's
    // buttons behind your shoulder. This is the recenter the menu offers,
    // taken for you, because arriving is exactly when you would ask for it.
    doRecenter();
  }

  // ---------- menu ----------

  // The tag sits at 25 degrees, which is the lighting booth on the stage
  // capture: above the top balcony, below the dome. It was at 38, and when the
  // heading moved to house centre that put it in the middle of the skylight.
  // Landing it on something the room actually has gives it somewhere to be.
  //
  // Icons rather than words, laid out as two rows: what there is on top, and
  // what you can do to the thing you picked underneath. Position is what you
  // remember rather than the reading, so nothing moves and nothing is ever
  // replaced, which is also why there is no "back" anywhere in here.
  //
  // This was a ring first. Five small tiles on a circle do not read as a circle,
  // they read as scattered, so there was no shape to learn and the whole reason
  // for the ring went with it. A row scans.
  // The menu has no timer at all. It closed itself on a countdown once, which
  // is a thing that can only ever happen at the wrong moment: it goes when you
  // say it goes.
  var MENU_REACH = 0.85;
  var TILE = 0.105;
  var HANDLE = 0.058;
  // how far above and below the piano its two height buttons sit
  var LIFT_REACH = 0.14;
  // The menu hangs from its tag. The tag is the thing you park and both rows
  // keep their fixed distance below it, so it moves as one piece and the shape
  // you have learned survives the move. These were 14 and 5 against a tag at
  // 25, which is where the drops come from.
  var ROW_DROP = THREE.MathUtils.degToRad(11);
  var BLOOM_DROP = THREE.MathUtils.degToRad(20);
  var TIP_DROP = THREE.MathUtils.degToRad(12);

  // How far the tag may be parked. Below 15 the options row reaches down onto
  // the green room's door marker at 12 degrees under the horizon, and two live
  // things in one place is how you leave a room you meant to stay in. Above 45
  // is further up than a neck wants to go for something you will look at all
  // evening.
  var TAB_MIN = THREE.MathUtils.degToRad(15);
  var TAB_MAX = THREE.MathUtils.degToRad(45);
  var ROW_STEP = THREE.MathUtils.degToRad(9);
  var GROUP_GAP = THREE.MathUtils.degToRad(5.5);
  var BLOOM_STEP = THREE.MathUtils.degToRad(8.2);
  var BLOOM_SHIFT = THREE.MathUtils.degToRad(6);
  var BLOOM_REACH = THREE.MathUtils.degToRad(26);   // furthest a row may sit off centre

  var menu = {
    open: false, sel: -1, idle: 0,
    tabYaw: 0, tabPitch: THREE.MathUtils.degToRad(25),
    ringYaw: 0,
    tab: null, ring: [], bloom: [], handles: []
  };
  var texCache = {};
  var allTiles = [];

  // The coordinate space is minus fifty to fifty about the centre, so every
  // glyph is drawn at one scale whatever size the tile ends up.
  function drawGlyph(g, name) {
    g.strokeStyle = '#F1F3F5';
    g.fillStyle = '#F1F3F5';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.lineJoin = 'round';

    function arrow(x1, y1, x2, y2) {
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      var a = Math.atan2(y2 - y1, x2 - x1), h = 13;
      g.beginPath();
      g.moveTo(x2, y2);
      g.lineTo(x2 - h * Math.cos(a - 0.5), y2 - h * Math.sin(a - 0.5));
      g.lineTo(x2 - h * Math.cos(a + 0.5), y2 - h * Math.sin(a + 0.5));
      g.closePath(); g.fill();
    }

    if (name === 'piano') {
      g.strokeRect(-46, -26, 92, 52);
      for (var i = -1; i <= 1; i++) {
        g.beginPath(); g.moveTo(i * 23, -26); g.lineTo(i * 23, 26); g.stroke();
      }
      [-34, -11, 12, 35].forEach(function (x) { g.fillRect(x - 6, -26, 12, 30); });
      return;
    }
    if (name === 'window') {
      g.strokeRect(-40, -34, 80, 68);
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(0, -34); g.lineTo(0, 34);
      g.moveTo(-40, 0); g.lineTo(40, 0);
      g.stroke();
      return;
    }
    if (name === 'room') {
      g.beginPath();
      g.moveTo(-34, 44); g.lineTo(-34, -8);
      g.quadraticCurveTo(-34, -44, 0, -44);
      g.quadraticCurveTo(34, -44, 34, -8);
      g.lineTo(34, 44);
      g.stroke();
      g.beginPath(); g.arc(18, 6, 5, 0, 6.284); g.fill();
      return;
    }
    if (name === 'movemenu') {
      g.strokeRect(-38, -13, 76, 26);
      g.lineWidth = 5;
      g.beginPath(); g.moveTo(-24, 0); g.lineTo(24, 0); g.stroke();
      g.lineWidth = 7;
      arrow(0, -22, 0, -46);
      arrow(0, 22, 0, 46);
      return;
    }
    if (name === 'exit') {
      // a doorway standing open on its far side, and you going out through it.
      // Deliberately nothing like the close cross: those two sit next to each
      // other and one of them ends the session.
      g.beginPath();
      g.moveTo(10, -42); g.lineTo(-34, -42); g.lineTo(-34, 42); g.lineTo(10, 42);
      g.stroke();
      arrow(0, 0, 42, 0);
      return;
    }
    if (name === 'recenter') {
      g.beginPath(); g.arc(0, 0, 26, 0, 6.284); g.stroke();
      [[0, -46, 0, -32], [0, 46, 0, 32], [-46, 0, -32, 0], [46, 0, 32, 0]].forEach(function (l) {
        g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); g.stroke();
      });
      g.beginPath(); g.arc(0, 0, 6, 0, 6.284); g.fill();
      return;
    }
    if (name === 'close') {
      g.beginPath();
      g.moveTo(-30, -30); g.lineTo(30, 30);
      g.moveTo(30, -30); g.lineTo(-30, 30);
      g.stroke();
      return;
    }
    if (name === 'lower' || name === 'higher') {
      g.beginPath(); g.moveTo(-44, 0); g.lineTo(44, 0); g.stroke();
      if (name === 'lower') arrow(0, 10, 0, 44); else arrow(0, -10, 0, -44);
      return;
    }
    if (name === 'gripH' || name === 'gripV') {
      g.lineWidth = 9;
      if (name === 'gripH') {
        g.beginPath(); g.moveTo(0, -30); g.lineTo(0, 30); g.stroke();
        arrow(14, 0, 42, 0); arrow(-14, 0, -42, 0);
      } else {
        g.beginPath(); g.moveTo(-30, 0); g.lineTo(30, 0); g.stroke();
        arrow(0, 14, 0, 42); arrow(0, -14, 0, -42);
      }
      return;
    }
    if (name === 'size') {
      g.strokeRect(-40, -30, 80, 60);
      arrow(-8, -6, -36, -26);
      arrow(8, 6, 36, 26);
      return;
    }
    if (name === 'addwindow') {
      g.strokeRect(-46, -38, 68, 62);
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(-12, -38); g.lineTo(-12, 24);
      g.moveTo(-46, -7); g.lineTo(22, -7);
      g.stroke();
      g.lineWidth = 8;
      g.beginPath();
      g.moveTo(34, 18); g.lineTo(34, 48);
      g.moveTo(19, 33); g.lineTo(49, 33);
      g.stroke();
      return;
    }
    if (name === 'move') {
      arrow(0, 0, 0, -40); arrow(0, 0, 0, 40);
      arrow(0, 0, -40, 0); arrow(0, 0, 40, 0);
      return;
    }
    if (name === 'hide' || name === 'show') {
      g.lineWidth = 6;
      g.beginPath();
      g.moveTo(-40, 0); g.quadraticCurveTo(0, -30, 40, 0);
      g.quadraticCurveTo(0, 30, -40, 0);
      g.stroke();
      g.beginPath(); g.arc(0, 0, 8, 0, 6.284); g.fill();
      if (name === 'hide') {
        g.beginPath(); g.moveTo(-34, -26); g.lineTo(34, 26); g.stroke();
      }
      return;
    }
    if (name === 'add') {
      g.beginPath();
      g.moveTo(0, -34); g.lineTo(0, 34);
      g.moveTo(-34, 0); g.lineTo(34, 0);
      g.stroke();
      return;
    }
  }

  // Icon above, a small word below it. The word stays because an icon on its
  // own asks you to guess, and guessing is what the old menu got wrong.
  function iconTexture(icon, label, accent) {
    var c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    var g = c.getContext('2d');

    g.fillStyle = accent ? 'rgba(239,233,223,0.95)' : 'rgba(20,22,25,0.88)';
    roundRect(g, 4, 4, 152, 152, 26); g.fill();
    g.strokeStyle = accent ? 'rgba(48,41,37,0.85)' : 'rgba(201,145,63,0.5)';
    g.lineWidth = accent ? 5 : 3;
    roundRect(g, 4, 4, 152, 152, 26); g.stroke();

    g.save();
    g.translate(80, 64);
    g.scale(0.6, 0.6);
    if (accent) { g.strokeStyle = '#191614'; g.fillStyle = '#191614'; }
    drawGlyph(g, icon);
    g.restore();

    g.fillStyle = accent ? '#191614' : '#D8DCE1';
    var size = 26;
    g.font = '500 ' + size + 'px system-ui, sans-serif';
    while (size > 13 && g.measureText(label).width > 138) {
      size -= 1;
      g.font = '500 ' + size + 'px system-ui, sans-serif';
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, 80, 132);

    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }

  function cachedIcon(icon, label, active) {
    var k = (active ? 'i+|' : 'i|') + icon + '|' + label;
    if (!texCache[k]) texCache[k] = iconTexture(icon, label, !!active);
    return texCache[k];
  }

  function cachedLabel(text, accent) {
    var k = (accent ? 'A:' : 'P:') + text;
    if (!texCache[k]) texCache[k] = labelTexture(text, accent);
    return texCache[k];
  }

  function plate(w, h, tex) {
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex || null, transparent: true, depthTest: false })
    );
    m.renderOrder = 10;
    return m;
  }

  function aimAt(obj, yawA, pitchA, radius) {
    var h = head();
    obj.position.set(
      h.x + radius * Math.cos(pitchA) * Math.sin(yawA),
      h.y + radius * Math.sin(pitchA),
      h.z - radius * Math.cos(pitchA) * Math.cos(yawA)
    );
    obj.lookAt(h);
  }

  function makeTile(size) {
    var s = size || TILE;
    var t = plate(s, s, null);
    t.renderOrder = 11;
    t.visible = false;
    var fg = new THREE.PlaneGeometry(1, s);
    fg.translate(0.5, 0, 0);
    var fill = new THREE.Mesh(fg, new THREE.MeshBasicMaterial({
      color: 0xC9913F, transparent: true, opacity: 0.34, depthTest: false
    }));
    fill.renderOrder = 12;
    fill.position.set(-s / 2, 0, 0.001);
    fill.visible = false;
    t.add(fill);
    t.userData.fill = fill;
    t.userData.size = s;
    scene.add(t);
    return t;
  }

  function buildMenu() {
    menu.tab = plate(0.17, 0.085, cachedLabel('menu', true));
    menu.tab.userData.id = 'open';
    menu.tab.visible = false;
    scene.add(menu.tab);

    var i;
    // six items fit the row today; the spare two are so that raising
    // PANEL_MAX cannot silently push close or the way out off the end
    for (i = 0; i < 8; i++) menu.ring.push(makeTile());
    for (i = 0; i < 5; i++) menu.bloom.push(makeTile());
    for (i = 0; i < 4; i++) {
      var hnd = plate(HANDLE, HANDLE, null);
      hnd.renderOrder = 13;
      hnd.visible = false;

  var LENS_FEATHER = 0.03;
  var EYE_FOV = 78;

  function distort(r) {
    var r2 = r * r;
    return r * (1 + DIST_K1 * r2 + DIST_K2 * r2 * r2);
  }

  // the r that distort() would send to target. Newton from the target itself,
  // which is already close because the polynomial is gentle and monotonic.
  function undistort(target) {
    var r = target, i, r2, f, d;
    for (i = 0; i < 8; i++) {
      r2 = r * r;
      f = r * (1 + DIST_K1 * r2 + DIST_K2 * r2 * r2) - target;
      d = 1 + 3 * DIST_K1 * r2 + 5 * DIST_K2 * r2 * r2;
      r -= f / d;
    }
    return r;
  }

  var rtL = null, rtR = null, warpScene = null, warpCam = null;
  var warpL = null, warpR = null, warpW = 0, warpH = 0;
  var warpTanX = 1, warpTanY = 1;

  // The grid is laid out in SCREEN space and carries texture coordinates found
  // by running the lens backwards. So every point of the half screen is filled,
  // nothing is clipped, and no part of the rendered texture is wasted: the
  // frustum is then chosen to be exactly the piece the grid actually asks for.
  // Building it the other way round, by pushing the texture's own grid outwards,
  // is what leaves the black rounded surround, and there is no need for it.
  function buildWarp(halfW, halfH) {
    var geo = new THREE.PlaneGeometry(2, 2, DIST_SEGMENTS, DIST_SEGMENTS);
    var pos = geo.attributes.position, uv = geo.attributes.uv;
    var yScale = halfH / halfW;          // round units: measured across the half screen
    var R = Math.sqrt(1 + yScale * yScale) * DIST_FIELD;   // r = 1 at the corner
    var n = pos.count, i;
    var ux = new Float32Array(n), uy = new Float32Array(n), mx = 0, my = 0;

    for (i = 0; i < n; i++) {
      var qx = pos.getX(i), qy = pos.getY(i) * yScale;
      var rs = Math.sqrt(qx * qx + qy * qy);
      var k = rs > 1e-6 ? undistort(rs / R) * R / rs : 1;
      ux[i] = qx * k; uy[i] = qy * k;
      if (Math.abs(ux[i]) > mx) mx = Math.abs(ux[i]);
      if (Math.abs(uy[i]) > my) my = Math.abs(uy[i]);
    }
    if (mx < 1e-6) mx = 1;
    if (my < 1e-6) my = 1;
    for (i = 0; i < n; i++) {
      uv.setXY(i, 0.5 + 0.5 * ux[i] / mx, 0.5 + 0.5 * uy[i] / my);
    }
    uv.needsUpdate = true;

    // Round units and tangents differ by one constant, the tangent at the
    // horizontal edge of the half screen, so the frustum the texture wants is
    // just the grid's own reach in those units.
    var tanEdgeX = Math.tan(THREE.MathUtils.degToRad(EYE_FOV) / 2) * (halfW / halfH);
    warpTanX = mx * tanEdgeX;
    warpTanY = my * tanEdgeX;
    return geo;
  }

  // The mask is measured on the vertex's own position, which is where it ends
  // up on the screen after the warp has moved it, so the hole stays round
  // rather than following the bend in the picture.
  function lensMaterial(tex, yScale) {
    return new THREE.ShaderMaterial({
      depthTest: false,
      uniforms: {
        map: { value: tex },
        yScale: { value: yScale },
        maskR: { value: LENS_MASK },
        feather: { value: LENS_FEATHER }
      },
      vertexShader: [
        'varying vec2 vUv;',
        'varying vec2 vLocal;',
        'void main() {',
        '  vUv = uv;',
        '  vLocal = position.xy;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D map;',
        'uniform float yScale;',
        'uniform float maskR;',
        'uniform float feather;',
        'varying vec2 vUv;',
        'varying vec2 vLocal;',
        'void main() {',
        '  vec4 c = texture2D(map, vUv);',
        '  if (maskR > 0.0) {',
        // round on the glass, not round in the picture: the half screen is
        // taller than it is wide, so y is measured in the same units as x
        '    float r = length(vec2(vLocal.x, vLocal.y * yScale));',
        '    c.rgb *= 1.0 - smoothstep(maskR - feather, maskR, r);',
        '  }',
        '  gl_FragColor = vec4(c.rgb, 1.0);',
        '}'
      ].join('\n')
    });
  }

  function ensureWarp(w, h) {
    var pr = renderer.getPixelRatio();
    var tw = Math.max(1, Math.floor(w / 2 * pr));
    var th = Math.max(1, Math.floor(h * pr));
    if (rtL && warpW === tw && warpH === th) return;
    warpW = tw; warpH = th;

    if (rtL) { rtL.dispose(); rtR.dispose(); }
    var opt = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
    rtL = new THREE.WebGLRenderTarget(tw, th, opt);
    rtR = new THREE.WebGLRenderTarget(tw, th, opt);

    if (!warpScene) {
      warpScene = new THREE.Scene();
      warpCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);

      // The line down the middle. It is what you line the viewer's septum up
      // with, and losing it made the thing harder to put on straight.
      var bar = new THREE.Mesh(
        new THREE.PlaneGeometry(0.006, 2),
        new THREE.MeshBasicMaterial({ color: 0x6B6560, depthTest: false })
      );
      bar.renderOrder = 2;
      warpScene.add(bar);
    }
    if (warpL) {
      warpScene.remove(warpL); warpL.geometry.dispose(); warpL.material.dispose();
      warpScene.remove(warpR); warpR.geometry.dispose(); warpR.material.dispose();
    }
    var geo = buildWarp(w / 2, h);
    warpL = new THREE.Mesh(geo, lensMaterial(rtL.texture, h / (w / 2)));
    warpR = new THREE.Mesh(geo.clone(), lensMaterial(rtR.texture, h / (w / 2)));
    warpL.scale.x = 0.5; warpL.position.x = -0.5;
    warpR.scale.x = 0.5; warpR.position.x = 0.5;
    warpScene.add(warpL); warpScene.add(warpR);
  }

  function render(t) {
    var now = (t || 0) / 1000;
    var dt = lastT ? Math.min(now - lastT, 0.1) : 0.016;
    lastT = now;

    if (dragLook()) camera.rotation.set(pitch, yaw, 0, 'YXZ');
    else if ((mode === 'stereo' || mode === 'window') && orient) applyOrientation(camera);

    updateGaze(dt);
    updateWindowProjection();

    if (mode === 'stereo') {
      // CSS pixels, not the canvas backing store. setViewport and setScissor
      // multiply by the pixel ratio themselves, so handing them domElement.width
      // counted the ratio twice: on a 2x screen the left eye's viewport covered
      // the whole canvas and the right eye's started one full width off the edge
      // of it and drew nothing at all. One picture filling the screen is what
      // that looks like, which is not a split screen and is not two eyes.
      //
      // Every phone and every iPad is 2x or better. The one place it looked
      // right was a plain 1x desktop, which is the only place it ever got
      // tested, which is the whole lesson.
      renderer.getSize(_screen);
      var w = _screen.x, h = _screen.y;
      ensureWarp(w, h);
      camera.updateMatrixWorld();
      [lc, rc].forEach(function (c, i) {
        // the frustum the grid asked for, rather than a round number, so the
        // texture holds exactly the piece of the world the lens will show
        c.fov = THREE.MathUtils.radToDeg(2 * Math.atan(warpTanY));
        c.aspect = warpTanX / warpTanY;
        c.near = 0.05; c.far = 1000;
        c.updateProjectionMatrix();
        c.position.setFromMatrixPosition(camera.matrixWorld);
        c.quaternion.setFromRotationMatrix(camera.matrixWorld);
        c.translateX((i === 0 ? -1 : 1) * IPD / 2);
        c.updateMatrixWorld(true);
      });
      // an eye apiece into its own texture, then both of them through the glass
      renderer.setRenderTarget(rtL);
      renderer.render(scene, lc);
      renderer.setRenderTarget(rtR);
      renderer.render(scene, rc);
      renderer.setRenderTarget(null);
      renderer.setViewport(0, 0, w, h);
      renderer.render(warpScene, warpCam);
    } else {
      renderer.render(scene, camera);
    }
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    // a tab moved between screens changes this, and it decides how the two eyes
    // are laid out, so it is re-read rather than fixed at startup
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function bindInput() {
    var el = renderer.domElement;
    function pt(e) { return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    var downX = 0, downY = 0, moved = 0;
    function down(e) {
      if (!dragLook()) { onTrigger(); return; }
      dragging = true; var p = pt(e); dragX = p.x; dragY = p.y;
      downX = p.x; downY = p.y; moved = 0;
    }
    function move(e) {
      if (!dragging || !dragLook()) return;
      var p = pt(e);
      yaw -= (p.x - dragX) * 0.005;
      pitch = Math.max(-1.5, Math.min(1.5, pitch - (p.y - dragY) * 0.005));
      dragX = p.x; dragY = p.y;
      moved = Math.max(moved, Math.abs(p.x - downX) + Math.abs(p.y - downY));
    }
    function up(e) {
      if (dragging && inScene && moved < 8) {
        if (mode === 'flat') tapAt(downX, downY);
        else onTrigger();
      }
      dragging = false;
    }

    function tapAt(px, py) {
      var r = el.getBoundingClientRect();
      var ndc = new THREE.Vector2(
        ((px - r.left) / r.width) * 2 - 1,
        -((py - r.top) / r.height) * 2 + 1
      );
      if (movingRig || grabbedEdge || recentering || parking) {
        if (movingRig) drop();
        else if (grabbedEdge) releaseEdge();
        else if (parking) finishParking();
        else finishRecenter();
        return;
      }
      raycaster.setFromCamera(ndc, camera);
      var hits = raycaster.intersectObjects(pickables, false);
      if (hits.length) { activate(hits[0].object.userData.id, 0.25); cooldown = COOLDOWN; }
    }
    el.addEventListener('mousedown', down);
    el.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, { passive: true });
    el.addEventListener('touchmove', move, { passive: true });
    el.addEventListener('touchend', function (e) { up(e); });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTrigger(); }
    });
  }

  function applyOptions() {
    // what you want in there with you is a decision for once you are in it
    if (!currentEnv) enterRoom(document.getElementById('env').value);
    piano.group.visible = piano.on;

    // one camera serves everything, and nothing asks for it until something needs it
    if (piano.on || panels.some(function (q) { return q.on; })) startPassthrough();

    placeAll();
    layoutMenu();
    scheduleSave();
  }

  function showChrome(on) {
    inScene = !!on;
    ui.style.display = on ? 'none' : 'block';
    hud.style.display = on ? 'flex' : 'none';
    if (!on) {
      movingRig = null; sizingRig = null; grabbedEdge = null;
      recentering = false; parking = false; hintPlate.visible = false;
    }
    layoutMenu();
  }

  function enterVR() {
    navigator.xr.requestSession('immersive-vr')
      .then(function (session) {
        applyOptions();
        mode = 'xr';
        framed = true;
        renderer.xr.setSession(session);
        session.addEventListener('select', onTrigger);
        session.addEventListener('end', function () { mode = 'flat'; movingRig = null; sizingRig = null; grabbedEdge = null; recentering = false; parking = false; steady = 0; showChrome(false); });
        showChrome(true);
      })
      .catch(function (e) {
        errEl.textContent = 'VR would not start here (' + e.message + '). Falling back to split screen.';
        enterStereo();
      });
  }

  // The phone held up as a window on the room, moved about to look, rather
  // than strapped to your face with the screen split. Same head tracking, same
  // everything: only the screen is not divided and it does not want the phone
  // held one way round, so it neither goes fullscreen nor locks the rotation.
  // Nothing about how the stereo picture is drawn is touched by this.
  // MOTION IS ASKED FOR FIRST, BEFORE ANYTHING ASKS FOR A CAMERA.
  //
  // On iOS both are permission prompts and both need the tap that opened them
  // to still count as a user gesture. Laying the room out came first, and that
  // asks for the camera as soon as a piano or a window is showing, which spends
  // the gesture: by the time the motion request went out there was nothing left
  // to authorise it, so it was refused without ever showing you the dialog and
  // head tracking silently never started. Two pictures side by side that do not
  // move when you do is what that looks like from the outside.
  //
  // Android never asked permission for motion at all, which is why this was
  // only ever wrong in Safari, and only once you had something placed.
  // Say it once, and say where the switch is. It is off by default on both,
  // and it is the first thing to check on anything Apple made.
  function noTracking() {
    errEl.textContent = 'No head tracking here, so drag to look around. ' +
      'On iPhone and iPad: Settings, Apps, Safari, Motion & Orientation Access.';
  }

  function enterWindow() {
    enableOrientation().then(function (ok) {
      applyOptions();
      mode = 'window';
      yawOffset = 0;
      framed = false;
      pendingRecenter = true;
      if (orient) doRecenter();
      showChrome(true);
      if (!ok) noTracking();
    });
  }

  function enterStereo() {
    enableOrientation().then(function (ok) {
      applyOptions();
      mode = 'stereo';
      yawOffset = 0;
      framed = false;
      pendingRecenter = true;
      if (orient) doRecenter();
      showChrome(true);
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      if (!ok) noTracking();
    });
  }

  init();
  bindInput();
  loadState();

  var envEl = document.getElementById('env');
  var tiles = document.querySelectorAll('.tile');

  function showEnv(value) {
    envEl.value = value;
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].setAttribute('aria-pressed', tiles[i].getAttribute('data-env') === value ? 'true' : 'false');
    }
    if (value === currentEnv) { loadSky(value); return; }
    enterRoom(value);
    loadSky(value);
    scheduleSave();
  }
  for (var t = 0; t < tiles.length; t++) {
    tiles[t].addEventListener('click', function () { showEnv(this.getAttribute('data-env')); });
  }
  envEl.addEventListener('change', function (e) { showEnv(e.target.value); });
  showEnv(envEl.value);

  var note = document.getElementById('modeNote');
  note.textContent = '';

  // Putting it on your face is one thing to do and immersive-vr is one call,
  // and the device is the one that knows which of them it means: a phone hands
  // it to Cardboard, with the lens correction and the divider and the viewer's
  // own profile, and a headset makes it a headset session. Neither needs
  // detecting, which is the whole point, because detecting it is what could not
  // be done and what kept being got wrong.
  //
  // Our split screen is the fallback for a phone with no session to give, an
  // iPhone being the one that matters. It is the only place it is ever the
  // right answer, and routing every phone to it is what took away the picture
  // that worked.
  var btnStereo = document.getElementById('enter');
  btnStereo.onclick = function () { enterStereo(); };

  // The phone as a window in your hand, which is the one way in with no session
  // behind it on any device. It does not take immersive-vr even where there is
  // one: that is the button above, whichever kind of face-mounted thing it turns
  // out to mean.
  var btn360 = document.getElementById('use360');
  btn360.onclick = function () { enterWindow(); };

  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
      if (ok) btnStereo.onclick = function () { enterVR(); };
    }).catch(function () {});
  }

  document.getElementById('forget').onclick = function () {
    forgetting = true;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    // v2 held an arrangement per room and v1 one global set placed differently;
    // neither is read any more, but leaving them behind makes "fresh" a lie
    try {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem('hill-practice-space-v2');
      localStorage.removeItem('hill-practice-space-v1');
    } catch (e) {}
    location.reload();
  };
  document.getElementById('peek').onclick = function () { applyOptions(); mode = 'flat'; showChrome(true); };
  document.getElementById('exit').onclick = leaveScene;
  document.getElementById('recenter').onclick = doRecenter;
}

function startPracticeSpace() {
  try { bootPracticeSpace(); }
  catch (err) {
    var e = document.getElementById('err');
    if (e) e.textContent = 'The 3D view could not start here: ' + err.message;
  }
}
// ---------- the PIN ----------
//
// Be clear about what this is and is not. Everything here runs on the visitor's
// device, so this keeps the page out of search results and out of the reach of
// anyone who merely stumbles on the link. It is not protection: the panoramas
// sit at their own URLs, and anyone who reads the page source can walk straight
// past this. If it needs to be genuinely private the gate has to live in front
// of the server, and amandacowell.com already goes through Cloudflare, whose
// Access product does exactly that with no change to this file.
//
// To change the password, replace the hash below with the SHA-256 of the new
// one, for instance from: echo -n music | sha256sum
var GATE_KEY = 'hill-practice-unlocked-v1';
var PIN_SHA256 = '80f189984e5ca70287d13342f6daa0db45cba3c131c4e46dc81360f3a4c4f690';

function sha256Hex(text) {
  var bytes = new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (x) {
      return ('00' + x.toString(16)).slice(-2);
    }).join('');
  });
}

function openTheDoor() {
  var gate = document.getElementById('gate');
  if (gate) gate.style.display = 'none';
  document.getElementById('ui').style.display = 'block';
  startPracticeSpace();
}

function setUpGate() {
  var unlocked = false;
  try { unlocked = localStorage.getItem(GATE_KEY) === 'yes'; } catch (e) {}
  if (unlocked) { openTheDoor(); return; }

  var form = document.getElementById('gateForm');
  var input = document.getElementById('pin');
  var err = document.getElementById('gateErr');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var tried = input.value.trim().toLowerCase();
    if (!tried) return;
    sha256Hex(tried).then(function (h) {
      if (h === PIN_SHA256) {
        try { localStorage.setItem(GATE_KEY, 'yes'); } catch (e2) {}
        openTheDoor();
      } else {
        err.textContent = 'Not that one.';
        input.value = '';
        input.focus();
      }
    }).catch(function () {
      err.textContent = 'This browser will not do the check. Open the page over https.';
    });
  });
  input.focus();
}

if (document.readyState === 'complete') setUpGate();
else window.addEventListener('load', setUpGate);
</script>
